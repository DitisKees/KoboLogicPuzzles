name: Build KOReader plugin

on:
  push:
    branches:
      - main
    paths:
      - 'apps/kobo/kobologicpuzzles.koplugin/**'
      - 'tests/kobo/**'
      - 'contracts/**'
      - '.github/workflows/kobo-plugin.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/kobo/kobologicpuzzles.koplugin/**'
      - 'tests/kobo/**'
      - 'contracts/**'
      - '.github/workflows/kobo-plugin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.package.outputs.version }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Package the plugin
        id: package
        working-directory: apps/kobo
        shell: bash
        run: |
          version="$(sed -nE 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"([0-9.]+)"[[:space:]]*,[[:space:]]*$/\1/p' kobologicpuzzles.koplugin/_meta.lua)"
          version_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$version" =~ $version_pattern || ${#version} -gt 24 ]]; then
            echo "::error::Set version in _meta.lua to a quoted MAJOR.MINOR.PATCH version."
            exit 1
          fi
          zip -qr "$RUNNER_TEMP/kobologicpuzzles.koplugin.zip" kobologicpuzzles.koplugin
          unzip -q "$RUNNER_TEMP/kobologicpuzzles.koplugin.zip" -d "$RUNNER_TEMP/kobo-plugin"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Download the KOReader Linux runtime
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          version=v2026.07.1
          archive="koreader-linux-x86_64-${version}.tar.xz"
          curl --fail --silent --show-error --location --retry 3 --max-time 90 \
            "https://github.com/koreader/koreader/releases/download/${version}/${archive}" --output "$archive"
          printf '%s  %s\n' "299aadb28147a25e9432ced1214ea444a4184393b5ae97cf42402c8a61b1a1b0" "$archive" \
            | sha256sum --check -
          mkdir koreader
          tar -xJf "$archive" -C koreader

      - name: Smoke test the packaged plugin
        working-directory: ${{ runner.temp }}/koreader/lib/koreader
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
          KO_MULTIUSER: '1'
        run: |
          export KO_HOME="$(mktemp -d)"
          ./luajit "$GITHUB_WORKSPACE/tests/kobo/smoke.lua" "$RUNNER_TEMP/kobo-plugin/kobologicpuzzles.koplugin"

      - name: Upload the installable ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/kobologicpuzzles.koplugin.zip
          archive: false
          if-no-files-found: error

  release:
    if: github.repository == 'DitisKees/KoboLogicPuzzles' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: kobo-release-${{ needs.package.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check for an existing release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          tag="kobo-v$VERSION"
          release="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$tag\") | if .draft then \"draft\" else \"published\" end")"
          case "$release" in
            published)
              echo "$tag is already published."
              exit 0
              ;;
            "")
              ;;
            *)
              echo "::error::A draft or conflicting release already uses $tag."
              exit 1
              ;;
          esac

          existing_tag="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" \
            --jq ".[] | select(.ref == \"refs/tags/$tag\") | .ref")"
          if [[ -n "$existing_tag" ]]; then
            tagged_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq '.sha')"
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "::error::$tag already points to a different commit."
              exit 1
            fi
          fi
          echo 'publish=true' >> "$GITHUB_OUTPUT"

      - name: Download the tested ZIP
        if: steps.release.outputs.publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kobologicpuzzles.koplugin.zip
          path: ${{ runner.temp }}
          skip-decompress: true

      - name: Publish the plugin release
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          gh release create "kobo-v$VERSION" "$RUNNER_TEMP/kobologicpuzzles.koplugin.zip" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Kobo Logic Puzzles $VERSION" \
            --notes "Extract kobologicpuzzles.koplugin into KOReader's plugins directory."
