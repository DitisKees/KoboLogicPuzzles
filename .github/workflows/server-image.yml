name: Publish server image

on:
  push:
    branches:
      - main
    paths:
      - 'apps/server/**'
      - 'tests/server/**'
      - 'KoboLogicPuzzles.slnx'
      - 'contracts/**'
      - '.github/workflows/server-image.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/server/**'
      - 'tests/server/**'
      - 'KoboLogicPuzzles.slnx'
      - 'contracts/**'
      - '.github/workflows/server-image.yml'
  workflow_dispatch:

concurrency:
  group: server-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Test the server
        run: dotnet test KoboLogicPuzzles.slnx --configuration Release

      - name: Build the server image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${image}:sha-${GITHUB_SHA}" \
            --tag "${image}:latest" \
            ./apps/server

      - name: Smoke test the built image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}"
          container="$(docker run --detach --publish 127.0.0.1::8080 \
            --env CatalogRefresh__Enabled=false --env HashiGeneration__Enabled=false \
            --env SlitherlinkGeneration__Enabled=false --env NurikabeGeneration__Enabled=false \
            --env TentsGeneration__Enabled=false --env BattleshipsGeneration__Enabled=false \
            --entrypoint bash "$image" -euc '
              dotnet KoboLogicPuzzles.Server.dll hashi-generate --size 20 --density 10 --seed 00000065
              dotnet KoboLogicPuzzles.Server.dll nurikabe-generate --size 50 --seed 2
              dotnet KoboLogicPuzzles.Server.dll placement-generate --game tents --size 50 --seed 2 --require-difficulty true
              dotnet KoboLogicPuzzles.Server.dll placement-generate --game battleships --size 30 --seed 2 --require-difficulty true
              dotnet KoboLogicPuzzles.Server.dll refresh-extra-collections --source world-at-play
              dotnet KoboLogicPuzzles.Server.dll refresh-extra-collections --source sen-ltd
              cat << "PACK" > /tmp/link-a-pix-smoke.json
          [{
            "width": 3, "height": 2,
            "clues": [{"cell":0,"length":4},{"cell":1,"length":4},{"cell":5,"length":1}],
            "paths": [[0,3,4,1]], "picture": "##.###",
            "attribution": {"source":"local","sourceId":"smoke","sourceUrl":"https://example.test/link-a-pix",
              "author":"Fixture","title":"Fixture","license":"CC0"}
          }]
          PACK
              dotnet KoboLogicPuzzles.Server.dll link-a-pix-import --file /tmp/link-a-pix-smoke.json
              exec dotnet KoboLogicPuzzles.Server.dll
            ')"
          trap 'status=$?; if ((status)); then docker logs "$container"; fi; docker rm -f "$container" >/dev/null' EXIT
          base="http://$(docker port "$container" 8080/tcp)"
          curl -fsS --retry 15 --retry-delay 1 --retry-all-errors --max-time 5 "$base/api/v2/capabilities" \
            | jq -e '.apiVersion == 2 and (.games | index("hashi") != null and index("nurikabe") != null and index("tents") != null and index("battleships") != null and index("link-a-pix") != null)'
          id="$(curl -fsS "$base/api/v2/puzzles?game=hashi" | jq -er '.puzzles[] | select(.width == 20 and .height == 20) | .id')"
          jq -n --arg id "$id" '{schemaVersion:1,boards:[{puzzleId:$id,completed:false,marks:[{edge:0,count:1,noBridge:false}]}]}' \
            | curl -fsS -H 'Content-Type: application/json' --data-binary @- "$base/api/v2/progress" \
            | jq -e '.savedCount == 1'
          curl -fsS "$base/api/v2/restore?game=hashi" \
            | jq -e --arg id "$id" 'length == 1 and .[0].progress.puzzleId == $id and .[0].progress.marks[0].count == 1'
          curl -fsS -H 'Content-Type: application/json' --data '{"game":"nurikabe","width":50,"targetCount":1}' "$base/api/v2/offline-queue" \
            | jq -e '.remaining == 0 and .puzzles[0].metadata.sourceKind == "generated" and .puzzles[0].metadata.unique and (.puzzles[0].solution | length == 2500)'
          for spec in 'tents 50' 'battleships 30'; do
            read -r game size <<< "$spec"
            jq -n --arg game "$game" --argjson size "$size" '{game:$game,targetCount:1,width:$size}' \
              | curl -fsS -H 'Content-Type: application/json' --data-binary @- "$base/api/v2/offline-queue" \
              | jq -e --arg game "$game" --argjson area "$((size * size))" \
                  '.remaining == 0 and (.puzzles[0] | .game == $game and .metadata.unique and (.solution | length == $area))'
          done
          curl -fsS -H 'Content-Type: application/json' --data '{"game":"link-a-pix","targetCount":1,"source":"local"}' "$base/api/v2/offline-queue" \
            | jq -e '.remaining == 0 and (.puzzles[0] | .game == "link-a-pix" and .metadata.unique and (.clues | length == 3))'
          curl -fsS "$base/api/v2/puzzles?game=hashi&source=sen-ltd" \
            | jq -e '(.puzzles | length) == 6 and .puzzles[0].metadata.sourceKind == "generated"'
          curl -fsS "$base/api/v2/puzzles?game=nonogram&source=world-at-play" \
            | jq -e '(.puzzles | length) == 32 and .puzzles[0].metadata.sourceKind == "collection"'


      - name: Publish to GitHub Container Registry
        if: github.repository == 'DitisKees/KoboLogicPuzzles' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "${image}:sha-${GITHUB_SHA}"
          docker push "${image}:latest"
